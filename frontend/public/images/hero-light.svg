<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8DCC8"/>
      <stop offset="55%" stop-color="#D4C4A8"/>
      <stop offset="100%" stop-color="#B89B7A"/>
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6F52"/>
      <stop offset="50%" stop-color="#A08060"/>
      <stop offset="100%" stop-color="#7A6048"/>
    </linearGradient>
    <radialGradient id="windowGlow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#FFF8E7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8D4B0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <ellipse cx="960" cy="380" rx="520" ry="340" fill="url(#windowGlow)"/>

  <!-- Window frame -->
  <rect x="560" y="120" width="800" height="520" rx="8" fill="#5C4A38" opacity="0.35"/>
  <rect x="590" y="150" width="740" height="460" rx="4" fill="#F5E6C8" opacity="0.5"/>
  <line x1="960" y1="150" x2="960" y2="610" stroke="#8B7355" stroke-width="4" opacity="0.4"/>
  <line x1="590" y1="380" x2="1330" y2="380" stroke="#8B7355" stroke-width="4" opacity="0.4"/>

  <!-- Bookshelves left -->
  <g opacity="0.85">
    <rect x="80" y="180" width="320" height="700" fill="#6B5344"/>
    <rect x="100" y="220" width="280" height="60" fill="#8B3A4A" opacity="0.7"/>
    <rect x="100" y="300" width="280" height="60" fill="#5C7A8B" opacity="0.6"/>
    <rect x="100" y="380" width="280" height="60" fill="#8B6B3A" opacity="0.65"/>
    <rect x="100" y="460" width="280" height="60" fill="#6B4A5C" opacity="0.6"/>
    <rect x="100" y="540" width="280" height="60" fill="#4A6B5C" opacity="0.55"/>
    <rect x="100" y="620" width="280" height="60" fill="#7A5C4A" opacity="0.6"/>
    <rect x="100" y="700" width="280" height="60" fill="#5C5A7A" opacity="0.55"/>
  </g>

  <!-- Bookshelves right -->
  <g opacity="0.85">
    <rect x="1520" y="180" width="320" height="700" fill="#6B5344"/>
    <rect x="1540" y="220" width="280" height="60" fill="#5C7A8B" opacity="0.6"/>
    <rect x="1540" y="300" width="280" height="60" fill="#8B3A4A" opacity="0.7"/>
    <rect x="1540" y="380" width="280" height="60" fill="#6B4A5C" opacity="0.6"/>
    <rect x="1540" y="460" width="280" height="60" fill="#8B6B3A" opacity="0.65"/>
    <rect x="1540" y="540" width="280" height="60" fill="#4A6B5C" opacity="0.55"/>
    <rect x="1540" y="620" width="280" height="60" fill="#7A5C4A" opacity="0.6"/>
    <rect x="1540" y="700" width="280" height="60" fill="#5C5A7A" opacity="0.55"/>
  </g>

  <!-- Floor -->
  <polygon points="0,880 1920,880 1920,1080 0,1080" fill="url(#floor)"/>

  <!-- Reading table -->
  <ellipse cx="960" cy="820" rx="280" ry="60" fill="#4A3828" opacity="0.5"/>
  <rect x="760" y="700" width="400" height="24" rx="4" fill="#5C4838"/>
  <rect x="780" y="724" width="20" height="100" fill="#4A3828"/>
  <rect x="1120" y="724" width="20" height="100" fill="#4A3828"/>

  <!-- Candles -->
  <g>
    <rect x="820" y="660" width="12" height="40" fill="#F5E6C8"/>
    <ellipse cx="826" cy="652" rx="8" ry="14" fill="#FFD878" opacity="0.9" filter="url(#softBlur)"/>
    <ellipse cx="826" cy="652" rx="4" ry="8" fill="#FFF0A0"/>
  </g>
  <g>
    <rect x="1088" y="660" width="12" height="40" fill="#F5E6C8"/>
    <ellipse cx="1094" cy="652" rx="8" ry="14" fill="#FFD878" opacity="0.9" filter="url(#softBlur)"/>
    <ellipse cx="1094" cy="652" rx="4" ry="8" fill="#FFF0A0"/>
  </g>

  <!-- Floating books -->
  <g opacity="0.75" transform="rotate(-12 700 400)">
    <rect x="680" y="380" width="48" height="64" rx="2" fill="#8B3A4A"/>
    <rect x="686" y="386" width="36" height="4" fill="#F5E6C8" opacity="0.5"/>
  </g>
  <g opacity="0.7" transform="rotate(8 1200 350)">
    <rect x="1180" y="330" width="44" height="58" rx="2" fill="#5C7A8B"/>
  </g>
  <g opacity="0.65" transform="rotate(-6 1050 280)">
    <rect x="1030" y="260" width="40" height="54" rx="2" fill="#8B6B3A"/>
  </g>

  <!-- Cat silhouette -->
  <ellipse cx="900" cy="790" rx="36" ry="20" fill="#2A2018" opacity="0.7"/>
  <circle cx="920" cy="772" r="18" fill="#2A2018" opacity="0.7"/>
  <polygon points="908,758 912,742 918,758" fill="#2A2018" opacity="0.7"/>
  <polygon points="922,758 926,742 932,758" fill="#2A2018" opacity="0.7"/>

  <!-- Sparkles -->
  <circle cx="480" cy="200" r="3" fill="#FFF8E0" opacity="0.8"/>
  <circle cx="1440" cy="240" r="2.5" fill="#FFF8E0" opacity="0.7"/>
  <circle cx="760" cy="160" r="2" fill="#FFF8E0" opacity="0.6"/>
  <circle cx="1180" cy="180" r="2.5" fill="#FFF8E0" opacity="0.75"/>
</svg>
